<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Once. Expose Everywhere. — Sessions 1 &amp; 2</title>
<style>
:root{
  --ink:#2D2D2D; --ink-soft:#5A5A5A; --ink-light:#8A8A8A;
  --purple:#9B7FBE; --purple-deep:#6B4E96; --purple-soft:#EDE5F7; --purple-line:#C5B3DC;
  --yellow:#FFD93D; --yellow-soft:#FFF4B8; --yellow-deep:#E5BA1F;
  --green:#7CB87C; --green-deep:#5A9C5A; --green-soft:#F0F8F0;
  --red:#D67373; --red-soft:#FBEEEE;
  --amber:#E8A547; --amber-soft:#FEF7E8;
  --code-bg:#F6F2FB; --card-line:#E4DAEF;
  --font: "Segoe UI", Calibri, system-ui, -apple-system, sans-serif;
  --mono: Consolas, "Cascadia Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#221A33;font-family:var(--font);color:var(--ink);overflow:hidden}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center}
#deck{width:1280px;height:720px;transform-origin:center center;position:relative;
      background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.55);border-radius:6px;overflow:hidden}
.slide{position:absolute;inset:0;padding:44px 52px 56px;display:none;flex-direction:column;background:#fff}
.slide.on{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- chrome ---------- */
.dots{position:absolute;top:30px;left:52px;display:flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i:first-child{background:var(--yellow)} .dots i:last-child{background:var(--purple)}
.badge{position:absolute;top:26px;right:52px;background:var(--purple-soft);color:var(--purple-deep);
       font-size:11px;font-weight:700;letter-spacing:1.3px;padding:6px 14px;border-radius:20px}
.foot{position:absolute;left:52px;right:52px;bottom:20px;display:flex;justify-content:space-between;
      font-size:11px;color:var(--ink-light)}
.foot b{font-weight:700}

h1{font-size:34px;margin:26px 0 0;letter-spacing:-.4px;line-height:1.15}
.sub{font-size:16px;color:var(--purple-deep);font-style:italic;margin:8px 0 0}
.body{flex:1;margin-top:22px;min-height:0}

/* ---------- primitives ---------- */
.card{border:1.5px solid var(--card-line);border-radius:14px;padding:18px 20px;background:#fff;
      box-shadow:0 2px 10px rgba(107,78,150,.07)}
.card.p{border-color:var(--purple-deep);border-width:2px}
.card.g{border-color:var(--green-deep);border-width:2px;background:var(--green-soft)}
.card.r{border-color:var(--red);border-width:2px;background:var(--red-soft)}
.card.y{border-color:var(--yellow-deep);border-width:2px;background:var(--yellow-soft)}
.card.v{border-color:var(--purple-deep);border-width:2px;background:var(--purple-soft)}
.lbl{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--purple-deep);margin:0 0 10px}
.lbl.r{color:var(--red)} .lbl.g{color:var(--green-deep)} .lbl.y{color:var(--yellow-deep)}
.pill{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;
      letter-spacing:1.2px;padding:5px 13px;border-radius:14px}
.pill.g{background:var(--green-deep)} .pill.p{background:var(--purple-deep)}
.pill.y{background:var(--yellow);color:var(--ink)}

ul{margin:0;padding:0;list-style:none}
li{font-size:15px;line-height:1.5;margin:0 0 9px;padding-left:22px;position:relative}
li::before{content:"➤";position:absolute;left:0;color:var(--purple);font-size:12px;top:2px}
ul.ok li::before{content:"✓";color:var(--green-deep);font-weight:800}
ul.no li::before{content:"✗";color:var(--red);font-weight:800}
li.dim{color:var(--ink-soft)}

pre{background:var(--code-bg);border:1px solid var(--purple-line);border-radius:10px;
    padding:14px 16px;font-family:var(--mono);font-size:14px;line-height:1.5;margin:0;
    white-space:pre;overflow:hidden;color:var(--ink)}
pre.sm{font-size:12px} pre.xs{font-size:11px} pre.lg{font-size:16px}
code{font-family:var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.94em}

.callout{background:var(--yellow-soft);border:1.5px solid var(--yellow);border-radius:12px;
         padding:13px 18px;text-align:center;font-size:15px;font-weight:600;line-height:1.45}
.underline{height:9px;background:var(--yellow);opacity:.75;border-radius:5px;margin-top:-14px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g2u{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g6{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:14px}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;align-items:center;border:1.4px solid var(--card-line);border-radius:11px;padding:11px 16px;gap:14px}

.num{width:40px;height:40px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--yellow-deep);
     display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 40px}
.ico{width:46px;height:46px;border-radius:50%;background:var(--purple-soft);display:grid;place-items:center;
     font-size:20px;flex:0 0 46px;border:1.5px solid var(--purple)}
.flex{display:flex;gap:13px;align-items:flex-start}

/* ---------- title slides ---------- */
.title-slide{padding:0;flex-direction:row}
.wash{width:34%;background:var(--purple-soft);position:relative;display:grid;place-items:center}
.title-right{flex:1;padding:64px 56px;display:flex;flex-direction:column;justify-content:center}
.title-right h2{font-size:56px;line-height:1.05;margin:0;letter-spacing:-1.5px}
.title-right h2 span{color:var(--purple-deep)}
.tagline{font-size:20px;color:var(--ink-soft);font-style:italic;margin:24px 0 0}
.setup{font-size:16px;line-height:1.7;margin:26px 0 0}
.setup b{color:var(--purple-deep)}
.credit{font-size:12px;color:var(--ink-light);margin-top:auto}
.hub{position:relative;width:280px;height:280px}
.hub .core{position:absolute;left:90px;top:90px;width:100px;height:100px;border-radius:50%;
           background:var(--yellow);border:3px solid var(--purple-deep);display:grid;place-items:center;
           font-weight:800;font-size:14px;color:var(--purple-deep);letter-spacing:1px}
.hub .sp{position:absolute;background:#fff;border:2px solid var(--purple-deep);border-radius:9px;
         padding:7px 0;width:82px;text-align:center;font-size:12px;font-weight:800;color:var(--purple-deep)}
.hub svg{position:absolute;inset:0}

/* ---------- closing ---------- */
.closing{background:var(--purple-soft);align-items:center;justify-content:center;text-align:center}
.closing .box{background:#fff;border:3px solid var(--purple-deep);border-radius:18px;padding:46px 54px;max-width:1000px}
.closing h2{font-size:36px;line-height:1.3;margin:0}
.closing h2 span{color:var(--purple-deep)}
.closing .q{font-size:18px;color:var(--ink-soft);font-style:italic;margin-top:34px}

/* ---------- notes panel ---------- */
#notes{position:fixed;right:0;top:0;bottom:0;width:430px;background:#160F22;color:#E8E2F5;
       padding:26px 26px 60px;overflow:auto;font-size:14.5px;line-height:1.65;
       border-left:3px solid var(--purple-deep);transform:translateX(100%);transition:.22s;z-index:20}
#notes.on{transform:none}
#notes h3{margin:0 0 6px;font-size:12px;letter-spacing:1.6px;color:var(--yellow);text-transform:uppercase}
#notes .t{font-size:17px;font-weight:700;margin:0 0 16px;color:#fff;line-height:1.3}
#notes p{margin:0 0 14px;white-space:pre-wrap}
#notes .time{position:sticky;bottom:-26px;margin:18px -26px -60px;padding:14px 26px;background:#0F0A18;
             font-size:12px;color:var(--purple-line);border-top:1px solid #2E2340}

/* ---------- hud ---------- */
#hud{position:fixed;left:16px;bottom:14px;color:#BCAEDA;font-size:12.5px;z-index:20;
     background:rgba(20,13,32,.82);padding:8px 15px;border-radius:20px;letter-spacing:.3px}
#hud b{color:#fff;font-weight:700}
#hud kbd{background:#2E2340;border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px;margin:0 1px}
#help{position:fixed;inset:0;background:rgba(15,10,24,.93);color:#EDE7F8;display:none;place-items:center;z-index:40}
#help.on{display:grid}
#help div{max-width:460px;font-size:15px;line-height:2.1}
#help kbd{background:#33264A;border-radius:5px;padding:2px 9px;font-family:var(--mono);
          font-size:13px;min-width:78px;display:inline-block;text-align:center;margin-right:14px}

@media print{
  html,body{overflow:visible;background:#fff}
  #stage{position:static;display:block}
  #deck{width:100%;height:auto;box-shadow:none;transform:none!important}
  .slide{display:flex!important;position:relative;page-break-after:always;
         width:1280px;height:720px;transform-origin:top left}
  #hud,#notes,#help{display:none!important}
}
</style>
</head>
<body>

<div id="stage"><div id="deck"></div></div>

<aside id="notes">
  <h3>Speaker notes</h3>
  <div class="t" id="nTitle"></div>
  <div id="nBody"></div>
  <div class="time" id="nTime"></div>
</aside>

<div id="hud"><b><span id="cur">1</span> / 28</b> &nbsp;·&nbsp; <kbd>→</kbd> next &nbsp; <kbd>N</kbd> notes &nbsp; <kbd>?</kbd> help</div>

<div id="help"><div>
  <kbd>→ / Space</kbd> next slide<br>
  <kbd>←</kbd> previous slide<br>
  <kbd>N</kbd> toggle speaker notes<br>
  <kbd>F</kbd> fullscreen<br>
  <kbd>Home / End</kbd> first / last slide<br>
  <kbd>1…9</kbd> jump to slide<br>
  <kbd>Ctrl+P</kbd> print all slides to PDF<br>
  <kbd>? / Esc</kbd> close this help
</div></div>

<script>
/* ============================================================
   Slide content. Each entry: { badge, html, notes, time }
   Content mirrors MCP-Workshop-Sessions-1-2.pptx slide for slide.
   ============================================================ */
const SLIDES = [
{

  title: "Title",
  html: `
  <div class="wash">
    <div class="hub">
      <svg viewBox="0 0 280 280">
        <g stroke="#9B7FBE" stroke-width="2" stroke-dasharray="5 5">
          <line x1="140" y1="140" x2="52" y2="52"/><line x1="140" y1="140" x2="228" y2="52"/>

},

{
  badge: "PART A · WHY", time: "2 min",
  title: "You Are Asking the Wrong Question",
  html: `
  <h1>You Are Asking the Wrong Question</h1>
  <div class="sub">And that is fine — almost everyone starts here.</div>
  <div class="body">
    <div class="g2" style="height:76%">
      <div class="card r">
        <span class="pill">WRONG QUESTION</span>
        <div style="font-size:24px;font-weight:800;margin:16px 0 18px;line-height:1.3">

  notes: `Show of hands: who has HEARD of MCP? Who has BUILT one? Usually many hands for the first, almost none for the second. That gap is the whole reason for this course.

Do not define MCP yet. Deliberately. They get the demo first.`

{
  badge: "PART A · LIVE DEMO", time: "4 min",
  title: "🔥 Live Demo — Here Is a CRM",
  html: `

    <div class="card y">

    </div>
  </div>`,
  notes: `Switch to the browser NOW. Do not explain architecture. Use the app like a salesperson would.

Order matters. Dashboard first (numbers feel real), then the kanban drag (movement holds attention), then a record drawer (depth), then Convert (the wow — three records created from one click).

Do not talk about code during this. Three minutes of pure product.`
},

{
  badge: "PART A · THE TRAP", time: "2 min",
  title: "The Trap: Writing the Same Logic Four Times",
  html: `

  <div class="sub">This is what most people do the week they discover MCP.</div>
  <div class="body">
    <div class="g2">

Local MCP
  └── CRM logic

Remote MCP
  └── CRM logic

Skill
  └── CRM logic</pre>

{
  badge: "PART A · THE SHAPE", time: "3 min",
  title: "The Shape We Build Instead",
  html: `
  <h1>The Shape We Build Instead</h1>
  <div class="sub">Copy this into your notes. You will see it in every session.</div>

      </g>
    </svg>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:11px;width:100%">
      ${["CLI|terminal|humans|g","WEB / REST|browser|humans|g","LOCAL MCP|Claude Code|coding agents|p",

        const [t,w,s,c]=x.split("|");
        const done = c==="g";

{

  title: "Five Doors Into the Same Room",

{
  badge: "PART B · THE APPLICATION", time: "4 min",

  html: `

  <div class="body" style="display:flex;flex-direction:column">

/* ============================================================
   Renderer + navigation
   ============================================================ */
const deck = document.getElementById("deck");
const TOTAL = SLIDES.length;

deck.innerHTML = SLIDES.map((s, i) => `
  <section class="slide ${s.cls || ""}" data-i="${i}">
    ${s.cls ? "" : `<div class="dots"><i></i><i></i></div>`}
    ${s.badge ? `<div class="badge">${s.badge}</div>` : ""}
    ${s.html}
    ${s.cls ? "" : `<div class="foot"><span>MCP Workshop · Sessions 1 &amp; 2 · Skillopedia × Claude Code</span>
                    <span><b>${i + 1} / ${TOTAL}</b></span></div>`}
  </section>`).join("");

let cur = 0;
const slides = [...document.querySelectorAll(".slide")];
const notesEl = document.getElementById("notes");

function show(i) {
  cur = Math.max(0, Math.min(TOTAL - 1, i));
  slides.forEach((s, n) => s.classList.toggle("on", n === cur));
  document.getElementById("cur").textContent = cur + 1;
  document.getElementById("nTitle").textContent = `${cur + 1}. ${SLIDES[cur].title}`;
  document.getElementById("nBody").innerHTML =
    SLIDES[cur].notes.split("\n\n").map(p => `<p>${p}</p>`).join("");
  document.getElementById("nTime").textContent = `⏱  ${SLIDES[cur].time}   ·   slide ${cur + 1} of ${TOTAL}`;
  location.hash = "#" + (cur + 1);
}

function fit() {
  const pad = notesEl.classList.contains("on") ? 470 : 40;
  const k = Math.min((innerWidth - pad) / 1280, (innerHeight - 40) / 720);
  deck.style.transform = `scale(${k})`;
  document.getElementById("stage").style.paddingRight =
    notesEl.classList.contains("on") ? "430px" : "0";
}

addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowRight" || k === " " || k === "PageDown") { show(cur + 1); e.preventDefault(); }
  else if (k === "ArrowLeft" || k === "PageUp") { show(cur - 1); e.preventDefault(); }
  else if (k === "Home") show(0);
  else if (k === "End") show(TOTAL - 1);
  else if (k.toLowerCase() === "n") { notesEl.classList.toggle("on"); fit(); }
  else if (k.toLowerCase() === "f") {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
  else if (k === "?") document.getElementById("help").classList.toggle("on");
  else if (k === "Escape") document.getElementById("help").classList.remove("on");
  else if (/^[1-9]$/.test(k)) show(parseInt(k, 10) - 1);
});

deck.addEventListener("click", (e) => show(cur + (e.clientX < innerWidth / 3 ? -1 : 1)));
document.getElementById("help").addEventListener("click", (e) => e.currentTarget.classList.remove("on"));
addEventListener("resize", fit);
addEventListener("hashchange", () => {
  const n = (parseInt(location.hash.slice(1), 10) || 1) - 1;
  if (n !== cur) show(n);
});

show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
fit();
</script>
</body>
